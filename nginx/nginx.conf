# Production-grade Nginx configuration for DPDP Consent Management API
# Domain: api.consent.yourdomain.com (replace with your actual domain)
# Python backend: FastAPI running on 127.0.0.1:8008
# Compliance: DPDP Act 2023, TLS 1.2+, strong cipher suite

user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging: structured format for analytics and debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance: zero-copy file transmission
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts: prevent slow client attacks and resource exhaustion
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # DPDP compliance: limit request payload to 64KB (§8 data minimization)
    client_max_body_size 64k;

    # Hide Nginx version from responses (security best practice)
    server_tokens off;

    # Gzip compression: reduce bandwidth for JSON/text APIs
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types application/json text/plain text/css text/javascript application/x-javascript;
    gzip_disable "msie6";
    gzip_comp_level 6;

    # ==========================================
    # RATE LIMITING ZONES (per DPDP security)
    # ==========================================

    # Global zone: 1000 req/min per IP address
    # Prevents brute force and DDoS attacks
    limit_req_zone $binary_remote_addr zone=global:10m rate=1000r/m;

    # Auth zone: 10 req/min per IP address
    # Strict limit on login/registration endpoints to prevent account enumeration
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Consent zone: 60 req/min per IP address
    # Moderate limit for consent submission/query operations
    limit_req_zone $binary_remote_addr zone=consent:10m rate=60r/m;

    # ==========================================
    # UPSTREAM: FastAPI backend pool
    # ==========================================
    upstream consent_api {
        # Single backend instance; add more servers for load balancing
        # Format: server 127.0.0.1:8008 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8008;

        # Connection pooling: reuse connections to reduce latency
        keepalive 32;
    }

    # ==========================================
    # HTTP → HTTPS REDIRECT (port 80)
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.consent.yourdomain.com;

        # Allow Let's Encrypt ACME challenges for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS (301 permanent)
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ==========================================
    # HTTPS SERVER BLOCK (port 443)
    # ==========================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.consent.yourdomain.com;

        # ==========================================
        # TLS/SSL CONFIGURATION (DPDP §8 compliance)
        # ==========================================

        # Certificate paths: generated by certbot
        # Replace with your actual paths if using custom certificates
        ssl_certificate /etc/letsencrypt/live.consent.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live.consent.yourdomain.com/privkey.pem;

        # TLS protocol versions: enforce TLS 1.2+ (reject TLS 1.0/1.1)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cipher suite: ECDHE-based ciphers first (forward secrecy), then RSA fallback
        # All ciphers below have HIGH security rating; excludes weak/export ciphers
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

        # Prefer server's cipher order (prevents downgrade attacks)
        ssl_prefer_server_ciphers on;

        # Session resumption cache: 10MB shared cache for 10-minute TTL
        # Improves performance for returning clients
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP stapling: include certificate status in TLS handshake (faster validation)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live.consent.yourdomain.com/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ==========================================
        # SECURITY HEADERS (Defense-in-Depth)
        # ==========================================

        # HSTS: force HTTPS for 1 year, include subdomains, allow preload
        # Prevents SSL stripping attacks; preload allows browser HSTS preload list
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent MIME type sniffing: treat as declared type only
        add_header X-Content-Type-Options "nosniff" always;

        # Clickjacking protection: deny embedding in frames
        add_header X-Frame-Options "DENY" always;

        # Referrer policy: do not leak referrer to external sites
        add_header Referrer-Policy "no-referrer" always;

        # Content Security Policy: prevent XSS, injection attacks
        # Allows no content by default; adjust for your frontend origin if needed
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # Disable browser caching of sensitive responses (optional)
        # Uncomment if using shared devices or public terminals
        # add_header Cache-Control "public, max-age=0" always;

        # ==========================================
        # LOCATION: /v1/auth/* (Authentication)
        # ==========================================
        location ~ ^/v1/auth/ {
            # Strict rate limit: 10 requests per minute per IP
            # Prevents brute force attacks on login/registration
            limit_req zone=auth burst=5 nodelay;

            # Proxy settings: forward all headers, preserve original IP
            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Connection pooling: reuse upstream connections
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Timeouts: prevent hanging connections
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering: don't buffer large responses
            proxy_buffering off;
        }

        # ==========================================
        # LOCATION: /v1/consents* (Consent operations)
        # ==========================================
        location ~ ^/v1/consents {
            # Moderate rate limit: 60 requests per minute per IP
            # Allows normal user activity while preventing abuse
            limit_req zone=consent burst=20 nodelay;

            # Proxy settings
            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering off;
        }

        # ==========================================
        # LOCATION: /v1/* (Remaining API routes)
        # ==========================================
        location ~ ^/v1/ {
            # Global rate limit: 1000 requests per minute per IP
            limit_req zone=global burst=50 nodelay;

            # Proxy settings
            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering off;
        }

        # ==========================================
        # LOCATION: /sdk/cmp.js (Public CMP Script)
        # ==========================================
        location /sdk/cmp.js {
            # Public endpoint: serve CMP JavaScript with CORS for all origins
            # This allows the CMP widget to be embedded on any website
            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # CORS for SDK: allow public cross-origin access
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            # Caching: allow browser caching of CMP script (24 hours)
            add_header Cache-Control "public, max-age=86400" always;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering off;
        }

        # ==========================================
        # LOCATION: /docs, /openapi.json (API docs)
        # ==========================================
        location ~ ^/(docs|openapi.json|redoc) {
            # Optional: restrict API docs to internal IPs only in production
            # Uncomment lines below to enable IP-based access control
            # allow 10.0.0.0/8;      # Internal network range
            # deny all;

            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering off;
        }

        # ==========================================
        # LOCATION: / (Catch-all, fallback)
        # ==========================================
        location / {
            # Return 404 for unknown paths
            return 404;
        }

        # ==========================================
        # HEALTH CHECK ENDPOINT (Internal use)
        # ==========================================
        location /health {
            access_log off;
            proxy_pass http://consent_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
