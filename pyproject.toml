[tool.poetry]
name = "consent-management"
version = "0.1.0"
description = "Consent Management Platform backend"
authors = ["CMP Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.125.0"
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.45"
aiosqlite = "^0.21.0"
aiomysql = "^0.3.2"
pymysql = "^1.1.2"
alembic = "^1.17.2"
pydantic = {extras = ["email"], version = "^2.12.5"}
passlib = "^1.7.4"
argon2-cffi = "^25.1.0"
pyjwt = "^2.10.1"
python-dotenv = "^1.2.1"
boto3 = "^1.43.0"
click = "^8.3.3"
redis = "^5.2.0"
cryptography = "^43.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
